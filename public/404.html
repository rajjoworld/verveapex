<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0;url=/" />
    <title>Page Not Found — Verve Apex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <script>
      // Try client-side redirect to preserve SPA routing
      (function(){
        var path = window.location.pathname || '/';
        if (path !== '/') {
          // Use history state to push the path then reload root
          try {
            var base = '/';
            sessionStorage.setItem('va:404-path', path + window.location.search + window.location.hash);
            window.location.replace(base);
          } catch (e) {
            window.location.replace('/');
          }
        }
      })();
    </script>
    <style>
      body{margin:0;display:grid;place-items:center;height:100vh;background:#0A0A0A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial}
      a{color:#a78bfa}
    </style>
  </head>
  <body>
    <div>
      <h1>Redirecting…</h1>
      <p>If you're not redirected, <a href="/">go to the homepage</a>.</p>
    </div>
  </body>
</html>
